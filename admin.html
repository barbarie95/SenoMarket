<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion Admin - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<section class="affiliate">

<h2>Connexion Administrateur</h2>


<div class="card">


<form id="loginForm">


<label>
Identifiant
</label>

<br>

<input type="text" id="identifiant" placeholder="Votre identifiant">


<br><br>


<label>
Mot de passe
</label>

<br>

<input type="password" id="motdepasse" placeholder="Votre mot de passe">


<br><br>


<button type="submit" class="gold-btn">
Se connecter
</button>


</form>


<p id="message"></p>


</div>


</section>



<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

e.preventDefault();


let identifiant = document.getElementById("identifiant").value;

let motdepasse = document.getElementById("motdepasse").value;



if(identifiant === "admin" && motdepasse === "seno2026"){


localStorage.setItem("adminConnecte", "oui");


window.location.href = "admin-affiliation.html";


}

else{


document.getElementById("message").innerHTML =
"Identifiant ou mot de passe incorrect";


}


});

</script>


</body>

</html>
