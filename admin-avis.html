<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Avis - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>



<section class="affiliate">


<h2>⭐ Gestion des avis clients</h2>

<p>
Consultez les avis clients de SenoMarket.
</p>



<div class="card">

<h3>Liste des avis</h3>

<div id="listeAvis">

<p>Chargement des avis...</p>

</div>

</div>



<br>


<a href="dashboard.html" class="gold-btn">
⬅ Retour au tableau de bord
</a>


</section>



<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>



<script>


const webhook = "https://senomarket.app.n8n.cloud/webhook/senomarket-admin?action=avis";


fetch(webhook)

.then(response => response.json())

.then(data => {


let zone = document.getElementById("listeAvis");

zone.innerHTML = "";


data.forEach(function(avis){


zone.innerHTML += `

<div class="card">

<h3>⭐ ${avis["Nom client"]}</h3>

<p>
Commentaire : ${avis["Commentaire"]}
</p>

<p>
Note : ${avis["Note"]}/5
</p>

<p>
Date : ${avis["Date"]}
</p>

<p>
Statut : ${avis["Statut"]}
</p>

</div>

`;


});


})


.catch(error => {

document.getElementById("listeAvis").innerHTML =
"Erreur de chargement des avis.";

});


</script>



</body>

</html>
