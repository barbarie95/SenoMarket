<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Produits - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>



<section class="affiliate">


<h2>🛒 Gestion des produits</h2>

<p>
Consultez les produits de SenoMarket.
</p>


<div class="card">

<h3>Liste des produits</h3>

<div id="listeProduits">

<p>Chargement des produits...</p>

</div>

</div>



<br>


<a href="dashboard.html" class="gold-btn">
⬅ Retour au tableau de bord
</a>


</section>



<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>



<script>


const webhook = "https://senomarket.app.n8n.cloud/webhook/senomarket-admin?action=produits";



fetch(webhook)

.then(response => response.json())

.then(data => {


let zone = document.getElementById("listeProduits");


zone.innerHTML = "";



data.forEach(function(produit){


zone.innerHTML += `

<div class="card">

<h3>🛒 ${produit["Nom du produit"]}</h3>

<p>
Description : ${produit["Description"]}
</p>

<p>
Prix : ${produit["Prix"]}
</p>

<p>
Catégorie : ${produit["Catégorie"]}
</p>

<p>
Statut : ${produit["Statut"]}
</p>

<a href="${produit["Lien achat"]}" class="gold-btn">
Acheter
</a>

</div>

`;


});


})


.catch(error => {

document.getElementById("listeProduits").innerHTML =
"Erreur de chargement des produits.";

});



</script>



</body>

</html>
