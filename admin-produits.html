<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Produits - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

<!-- Bibliothèque Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- JavaScript principal SenoMarket -->
<script src="js/script.js"></script>

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>



<section class="affiliate">


<h2>🛒 Gestion des produits</h2>

<p>
Ajoutez et gérez les produits de SenoMarket.
</p>



<!-- ============================= -->
<!-- FORMULAIRE PRODUIT -->
<!-- ============================= -->

<div class="card">

<h3 id="titreFormulaire">
➕ Ajouter un produit
</h3>


<input
type="text"
id="nom"
placeholder="Nom du produit"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>


<input
type="number"
id="prix"
placeholder="Prix"
step="0.01"
min="0"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>


<textarea
id="description"
placeholder="Description du produit"
rows="4"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
></textarea>


<input
type="text"
id="categorie"
placeholder="Catégorie"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>


<input
type="url"
id="image_url"
placeholder="URL de l'image du produit"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>


<input
type="url"
id="lien_achat"
placeholder="Lien d'achat"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>


<br>


<label>

<input
type="checkbox"
id="actif"
checked
>

Produit actif

</label>


<br><br>


<button
type="button"
onclick="enregistrerProduit()"
class="gold-btn"
id="boutonEnregistrer"
>
Ajouter le produit
</button>


<button
type="button"
onclick="annulerModification()"
class="gold-btn"
id="boutonAnnuler"
style="display:none;"
>
Annuler
</button>


<p id="message"></p>

</div>



<br><br>



<!-- ============================= -->
<!-- LISTE DES PRODUITS -->
<!-- ============================= -->

<div class="card">

<h3>
📦 Produits enregistrés
</h3>


<div id="listeProduits">

<p>
Chargement des produits...
</p>

</div>

</div>



<br>


<a href="dashboard.html" class="gold-btn">
⬅ Retour au tableau de bord
</a>


</section>



<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>



<script>


/* =========================================
   PROTECTION DE L'ESPACE ADMINISTRATEUR
========================================= */

const admin =
localStorage.getItem("adminConnecte");


if(admin !== "oui"){

    window.location.href =
    "administrateur.html";

}



/* =========================================
   VARIABLE DE MODIFICATION
========================================= */

let produitEnModification = null;



/* =========================================
   CHARGER LES PRODUITS
========================================= */

async function chargerProduits(){

    const zone =
    document.getElementById("listeProduits");


    zone.innerHTML =
    "<p>Chargement des produits...</p>";


    const {
        data,
        error
    } = await supabaseClient

        .from("produits")

        .select("*")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if(error){

        console.error(
            "Erreur Supabase :",
            error
        );


        zone.innerHTML = `
            <p style="color:red;">
                Erreur lors du chargement des produits.
            </p>
        `;

        return;
    }


    if(!data || data.length === 0){

        zone.innerHTML = `
            <p>
                Aucun produit enregistré.
            </p>
        `;

        return;
    }


    zone.innerHTML = "";


    data.forEach(function(produit){


        const statut =
        produit.actif
        ? "🟢 Actif"
        : "🔴 Inactif";


        const image =
        produit.image_url
        ?
        `
        <img
            src="${echapperHTML(produit.image_url)}"
            alt="${echapperHTML(produit.nom)}"
            style="
                max-width:200px;
                border-radius:10px;
                margin-bottom:10px;
            "
        >
        `
        :
        "";


        const lien =
        produit.lien_achat
        ?
        `
        <p>
            <a
                href="${echapperHTML(produit.lien_achat)}"
                target="_blank"
                rel="noopener noreferrer"
                class="gold-btn"
            >
                🔗 Voir le lien d'achat
            </a>
        </p>
        `
        :
        "";


        zone.innerHTML += `

        <div
            class="card"
            style="margin-bottom:20px;"
        >

            ${image}


            <h3>
                🛒 ${echapperHTML(produit.nom || "")}
            </h3>


            <p>
                <strong>Prix :</strong>
                ${produit.prix ?? ""}
            </p>


            <p>
                <strong>Catégorie :</strong>
                ${echapperHTML(
                    produit.categorie || "Non définie"
                )}
            </p>


            <p>
                <strong>Description :</strong>
                ${echapperHTML(
                    produit.description || "Aucune description"
                )}
            </p>


            <p>
                <strong>Statut :</strong>
                ${statut}
            </p>


            ${lien}


            <button
                type="button"
                class="gold-btn"
                onclick="modifierProduit('${produit.id}')"
            >
                ✏️ Modifier
            </button>


            <button
                type="button"
                class="gold-btn"
                onclick="changerStatut('${produit.id}', ${!produit.actif})"
            >
                ${
                    produit.actif
                    ? "🔴 Désactiver"
                    : "🟢 Activer"
                }
            </button>


            <button
                type="button"
                class="gold-btn"
                onclick="supprimerProduit('${produit.id}')"
            >
                🗑️ Supprimer
            </button>

        </div>

        `;

    });

}



/* =========================================
   AJOUTER OU MODIFIER
========================================= */

async function enregistrerProduit(){


    const nom =
    document
        .getElementById("nom")
        .value
        .trim();


    const prix =
    document
        .getElementById("prix")
        .value;


    const description =
    document
        .getElementById("description")
        .value
        .trim();


    const categorie =
    document
        .getElementById("categorie")
        .value
        .trim();


    const image_url =
    document
        .getElementById("image_url")
        .value
        .trim();


    const lien_achat =
    document
        .getElementById("lien_achat")
        .value
        .trim();


    const actif =
    document
        .getElementById("actif")
        .checked;


    const message =
    document.getElementById("message");


    if(!nom){

        message.style.color = "red";

        message.textContent =
        "Veuillez entrer le nom du produit.";

        return;
    }


    if(prix === ""){

        message.style.color = "red";

        message.textContent =
        "Veuillez entrer le prix.";

        return;
    }


    const produit = {

        nom: nom,

        prix: Number(prix),

        description: description || null,

        categorie: categorie || null,

        image_url: image_url || null,

        lien_achat: lien_achat || null,

        actif: actif

    };



    /* =====================================
       MODIFICATION
    ===================================== */

    if(produitEnModification){

        const {
            error
        } = await supabaseClient

            .from("produits")

            .update(produit)

            .eq(
                "id",
                produitEnModification
            );


        if(error){

            console.error(error);

            message.style.color = "red";

            message.textContent =
            "Erreur lors de la modification du produit.";

            return;
        }


        message.style.color = "green";

        message.textContent =
        "✅ Produit modifié avec succès.";

    }



    /* =====================================
       AJOUT
    ===================================== */

    else{

        const {
            error
        } = await supabaseClient

            .from("produits")

            .insert(produit);


        if(error){

            console.error(error);

            message.style.color = "red";

            message.textContent =
            "Erreur lors de l'ajout du produit.";

            return;
        }


        message.style.color = "green";

        message.textContent =
        "✅ Produit ajouté avec succès.";

    }


    reinitialiserFormulaire();

    await chargerProduits();

}



/* =========================================
   PRÉPARER UNE MODIFICATION
========================================= */

async function modifierProduit(id){


    const {
        data,
        error
    } = await supabaseClient

        .from("produits")

        .select("*")

        .eq("id", id)

        .single();


    if(error){

        console.error(error);

        alert(
            "Impossible de récupérer le produit."
        );

        return;
    }


    produitEnModification =
    data.id;


    document
        .getElementById("nom")
        .value =
        data.nom || "";


    document
        .getElementById("prix")
        .value =
        data.prix ?? "";


    document
        .getElementById("description")
        .value =
        data.description || "";


    document
        .getElementById("categorie")
        .value =
        data.categorie || "";


    document
        .getElementById("image_url")
        .value =
        data.image_url || "";


    document
        .getElementById("lien_achat")
        .value =
        data.lien_achat || "";


    document
        .getElementById("actif")
        .checked =
        data.actif;


    document
        .getElementById("titreFormulaire")
        .textContent =
        "✏️ Modifier le produit";


    document
        .getElementById("boutonEnregistrer")
        .textContent =
        "Enregistrer les modifications";


    document
        .getElementById("boutonAnnuler")
        .style.display =
        "inline-block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



/* =========================================
   CHANGER LE STATUT
========================================= */

async function changerStatut(
    id,
    nouveauStatut
){


    const {
        error
    } = await supabaseClient

        .from("produits")

        .update({

            actif: nouveauStatut

        })

        .eq("id", id);


    if(error){

        console.error(error);

        alert(
            "Impossible de modifier le statut."
        );

        return;
    }


    await chargerProduits();

}



/* =========================================
   SUPPRIMER UN PRODUIT
========================================= */

async function supprimerProduit(id){


    const confirmation =
    confirm(
        "Voulez-vous vraiment supprimer ce produit ?"
    );


    if(!confirmation){

        return;

    }


    const {
        error
    } = await supabaseClient

        .from("produits")

        .delete()

        .eq("id", id);


    if(error){

        console.error(error);

        alert(
            "Impossible de supprimer le produit."
        );

        return;
    }


    await chargerProduits();

}



/* =========================================
   ANNULER LA MODIFICATION
========================================= */

function annulerModification(){

    reinitialiserFormulaire();

}


/* =========================================
   RÉINITIALISER LE FORMULAIRE
========================================= */

function reinitialiserFormulaire(){


    produitEnModification =
    null;


    document
        .getElementById("nom")
        .value = "";


    document
        .getElementById("prix")
        .value = "";


    document
        .getElementById("description")
        .value = "";

    document
        .getElementById("categorie")
        .value = "";


    document
        .getElementById("image_url")
        .value = "";


    document
        .getElementById("lien_achat")
        .value = "";


    document
        .getElementById("actif")
        .checked = true;


    document
        .getElementById("titreFormulaire")
        .textContent =
        "➕ Ajouter un produit";

    document
        .getElementById("boutonEnregistrer")
        .textContent =
        "Ajouter le produit";

    document
        .getElementById("boutonAnnuler")
        .style.display =
        "none";
  
    document
        .getElementById("message")
        .textContent = "";

}

/* =========================================
   PROTECTION CONTRE L'INSERTION HTML
========================================= */

function echapperHTML(texte){

    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

/* =========================================
   CHARGEMENT INITIAL
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        chargerProduits();

    }
);

</script>


</body>

  </html>
