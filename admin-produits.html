<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Produits - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/script.js"></script>

<style>

/* =========================================
   ONGLETS CATEGORIES (nouveau)
========================================= */

.onglets-categorie {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 10px 0 20px;
}

.onglet-btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #FFD700;
    background: #fff;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.onglet-btn.actif {
    background: #111;
    color: #FFD700;
}

</style>

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>



<section class="affiliate">


<h2>🛒 Gestion des produits</h2>


<p>Ajoutez et gérez les produits de SenoMarket.</p>



<!-- =========================================
     ONGLETS CATEGORIES (nouveau)
========================================= -->

<div class="onglets-categorie">

<button type="button" class="onglet-btn actif" id="onglet-formations" onclick="selectionnerOnglet('formations')">
📚 Guide et formation
</button>

<button type="button" class="onglet-btn" id="onglet-plans" onclick="selectionnerOnglet('plans')">
🏠 Plan et bâtiment
</button>

<button type="button" class="onglet-btn" id="onglet-cuisine" onclick="selectionnerOnglet('cuisine')">
🍳 Cuisine et recettes
</button>

</div>



<!-- =========================================
     FORMULAIRE PRODUIT
========================================= -->

<div class="card">


<h3 id="titreFormulaire">➕ Ajouter un produit (Guide et formation)</h3>


<input
type="text"
id="nom"
placeholder="Nom du produit"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;border:1px solid #ddd;"
>


<input
type="number"
id="prix"
placeholder="Prix"
step="0.01"
min="0"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;border:1px solid #ddd;"
>


<textarea
id="description"
placeholder="Description du produit"
rows="4"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;border:1px solid #ddd;resize:vertical;"
></textarea>


<!-- catégorie déterminée automatiquement par l'onglet actif, plus de champ texte libre -->
<input type="hidden" id="categorie" value="formations">


<!-- =========================================
     PHOTO DU PRODUIT
========================================= -->

<label style="display:block;margin-top:10px;">
📷 Photo du produit
</label>

<input
type="file"
id="image_fichier"
accept="image/*"
style="padding:10px;width:90%;margin:6px 0;border-radius:10px;border:1px solid #ddd;background:#fff;"
>

<div id="apercuImage" style="margin:10px 0;"></div>


<input
type="url"
id="lien_achat"
placeholder="Lien d'achat"
style="padding:12px;width:90%;margin:6px 0;border-radius:10px;border:1px solid #ddd;"
>


<br>


<label>
<input type="checkbox" id="actif" checked>
Produit actif
</label>


<br><br>


<button type="button" onclick="enregistrerProduit()" class="gold-btn" id="boutonEnregistrer">
Ajouter le produit
</button>


<button type="button" onclick="annulerModification()" class="gold-btn" id="boutonAnnuler" style="display:none;">
Annuler
</button>


<p id="message"></p>


</div>



<br><br>



<!-- =========================================
     LISTE PRODUITS
========================================= -->

<div class="card">

<h3 id="titreListe">📦 Produits enregistrés (Guide et formation)</h3>

<div id="listeProduits">
<p>Chargement des produits...</p>
</div>

</div>



<br>



<a href="dashboard.html" class="gold-btn">⬅ Retour au tableau de bord</a>


</section>



<footer>
<p>© 2026 SenoMarket - Transformez vos idées en réussite</p>
</footer>



<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL = "https://vfnqwdwgkocpkkaofrum.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BOFyx3zpbcwtN6h-3N0wLw_L1QOJWR-";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);



/* =========================================
   VERIFICATION SESSION
========================================= */

async function verifierSession(){

    const { data:{ session } } =
        await supabaseClient.auth.getSession();

    if(!session){

        window.location.href =
            "administrateur.html";

        return false;
    }

    return true;

}



/* =========================================
   VARIABLES
========================================= */

let produitEnModification = null;
let imageUrlActuelle = null;

let categorieActive = "formations";

const nomsCategories = {
    formations: "Guide et formation",
    plans: "Plan et bâtiment",
    cuisine: "Cuisine et recettes"
};



/* =========================================
   ONGLETS CATEGORIES (nouveau)
========================================= */

function selectionnerOnglet(categorie) {

    categorieActive = categorie;

    document.querySelectorAll(".onglet-btn").forEach(btn => {
        btn.classList.remove("actif");
    });
    document.getElementById("onglet-" + categorie).classList.add("actif");

    document.getElementById("categorie").value = categorie;

    reinitialiserFormulaire();

    document.getElementById("titreListe").textContent =
        "📦 Produits enregistrés (" + nomsCategories[categorie] + ")";

    chargerProduits();

}



/* =========================================
   CHARGER LES PRODUITS
========================================= */

async function chargerProduits() {

    const zone = document.getElementById("listeProduits");
    zone.innerHTML = "<p>Chargement des produits...</p>";

    if (typeof supabaseClient === "undefined" || !supabaseClient) {
        zone.innerHTML = `<p style="color:red;">❌ Supabase n'est pas disponible.</p>`;
        return;
    }

    const resultat = await supabaseClient
        .from("produits")
        .select("*")
        .eq("categorie", categorieActive)
        .order("created_at", { ascending:false });

    if (resultat.error) {
        console.error(resultat.error);
        zone.innerHTML = `
            <p style="color:red;">❌ Erreur Supabase</p>
            <p style="color:red;">${echapperHTML(resultat.error.message)}</p>
        `;
        return;
    }

    const data = resultat.data;

    if (!data || data.length === 0) {
        zone.innerHTML = `<p>Aucun produit enregistré dans cette catégorie.</p>`;
        return;
    }

    zone.innerHTML = "";

    data.forEach(produit => {

        const statut = produit.actif ? "🟢 Actif" : "🔴 Inactif";

        const image = produit.image_url
            ? `<img src="${echapperHTML(produit.image_url)}" alt="${echapperHTML(produit.nom || "")}" style="max-width:200px;border-radius:10px;margin-bottom:10px;">`
            : "";

        const lien = produit.lien_achat
            ? `<p><a href="${echapperHTML(produit.lien_achat)}" target="_blank" rel="noopener noreferrer" class="gold-btn">🔗 Voir le lien d'achat</a></p>`
            : "";

        zone.innerHTML += `
            <div class="card" style="margin-bottom:20px;">
                ${image}
                <h3>🛒 ${echapperHTML(produit.nom || "")}</h3>
                <p><strong>Prix :</strong> ${produit.prix ?? ""}</p>
                <p><strong>Description :</strong> ${echapperHTML(produit.description || "Aucune description")}</p>
                <p><strong>Statut :</strong> ${statut}</p>
                ${lien}
                <button class="gold-btn" onclick="modifierProduit('${produit.id}')">✏️ Modifier</button>
                <button class="gold-btn" onclick="changerStatut('${produit.id}', ${!produit.actif})">
                    ${produit.actif ? "🔴 Désactiver" : "🟢 Activer"}
                </button>
                <button class="gold-btn" onclick="supprimerProduit('${produit.id}')">🗑️ Supprimer</button>
            </div>
        `;
    });
}



/* =========================================
   UPLOAD IMAGE VERS SUPABASE STORAGE
========================================= */

async function televerserImage(fichier) {

    const extension = fichier.name.split(".").pop();
    const nomFichier =
        "produit_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000) +
        "." +
        extension;

    const resultat = await supabaseClient
        .storage
        .from("produits")
        .upload(nomFichier, fichier);

    if (resultat.error) {
        throw new Error(
            "Échec de l'envoi de l'image : " + resultat.error.message
        );
    }

    const urlPublique = supabaseClient
        .storage
        .from("produits")
        .getPublicUrl(nomFichier);

    return urlPublique.data.publicUrl;
}



/* =========================================
   PRÉVISUALISATION DE L'IMAGE CHOISIE
========================================= */

document.getElementById("image_fichier").addEventListener("change", function(e) {

    const zone = document.getElementById("apercuImage");
    const fichier = e.target.files[0];

    if (!fichier) {
        zone.innerHTML = "";
        return;
    }

    const url = URL.createObjectURL(fichier);
    zone.innerHTML = `<img src="${url}" style="max-width:150px;border-radius:10px;">`;
});



/* =========================================
   AJOUTER / MODIFIER PRODUIT
========================================= */

async function enregistrerProduit() {

    const nom = document.getElementById("nom").value.trim();
    const prix = document.getElementById("prix").value;
    const description = document.getElementById("description").value.trim();
    const categorie = categorieActive;
    const lien_achat = document.getElementById("lien_achat").value.trim();
    const actif = document.getElementById("actif").checked;
    const fichierImage = document.getElementById("image_fichier").files[0];

    const message = document.getElementById("message");
    const bouton = document.getElementById("boutonEnregistrer");

    if (!nom) {
        message.style.color = "red";
        message.textContent = "Veuillez entrer le nom du produit.";
        return;
    }

    if (prix === "") {
        message.style.color = "red";
        message.textContent = "Veuillez entrer le prix.";
        return;
    }

    bouton.disabled = true;
    message.style.color = "#555";
    message.textContent = "Enregistrement...";

    let image_url = imageUrlActuelle;

    try {

        if (fichierImage) {

            message.textContent = "Téléversement de l'image...";
            image_url = await televerserImage(fichierImage);

        }

        const produit = {
            nom,
            prix: Number(prix),
            description: description || null,
            categorie,
            image_url: image_url || null,
            lien_achat: lien_achat || null,
            actif
        };

        let resultat;

        if (produitEnModification) {
            resultat = await supabaseClient
                .from("produits")
                .update(produit)
                .eq("id", produitEnModification);
        } else {
            resultat = await supabaseClient
                .from("produits")
                .insert(produit);
        }

        if (resultat.error) {
            message.style.color = "red";
            message.textContent = resultat.error.message;
            bouton.disabled = false;
            return;
        }

        message.style.color = "green";
        message.textContent = produitEnModification
            ? "✅ Produit modifié avec succès."
            : "✅ Produit ajouté avec succès.";

        reinitialiserFormulaire();
        await chargerProduits();

    } catch (erreur) {

        console.error(erreur);
        message.style.color = "red";
        message.textContent = erreur.message || "Une erreur est survenue.";

    } finally {

        bouton.disabled = false;

    }

}



/* =========================================
   MODIFIER
========================================= */

async function modifierProduit(id) {

    const resultat = await supabaseClient
        .from("produits")
        .select("*")
        .eq("id", id)
        .single();

    if (resultat.error) {
        alert(resultat.error.message);
        return;
    }

    const data = resultat.data;

    produitEnModification = data.id;
    imageUrlActuelle = data.image_url || null;

    document.getElementById("nom").value = data.nom || "";
    document.getElementById("prix").value = data.prix ?? "";
    document.getElementById("description").value = data.description || "";
    document.getElementById("categorie").value = data.categorie || categorieActive;
    document.getElementById("lien_achat").value = data.lien_achat || "";
    document.getElementById("actif").checked = data.actif;
    document.getElementById("image_fichier").value = "";

    const apercu = document.getElementById("apercuImage");
    apercu.innerHTML = data.image_url
        ? `<img src="${data.image_url}" style="max-width:150px;border-radius:10px;">`
        : "";

    document.getElementById("titreFormulaire").textContent =
        "✏️ Modifier le produit (" + nomsCategories[categorieActive] + ")";
    document.getElementById("boutonEnregistrer").textContent = "Enregistrer les modifications";
    document.getElementById("boutonAnnuler").style.display = "inline-block";

    window.scrollTo({ top:0, behavior:"smooth" });

}



/* =========================================
   ACTIVER / DESACTIVER
========================================= */

async function changerStatut(id, nouveauStatut) {

    const resultat = await supabaseClient
        .from("produits")
        .update({ actif: nouveauStatut })
        .eq("id", id);

    if (resultat.error) {
        alert("❌ Impossible de modifier le statut.\n\n" + resultat.error.message);
        return;
    }

    alert(nouveauStatut ? "✅ Produit activé." : "✅ Produit désactivé.");
    await chargerProduits();

}



/* =========================================
   SUPPRIMER
========================================= */

async function supprimerProduit(id) {

    if (!confirm("Voulez-vous vraiment supprimer ce produit ?")) {
        return;
    }

    const resultat = await supabaseClient
        .from("produits")
        .delete()
        .eq("id", id);

    if (resultat.error) {
        alert("❌ Impossible de supprimer ce produit.\n\n" + resultat.error.message);
        return;
    }

    alert("✅ Produit supprimé.");
    await chargerProduits();

}



/* =========================================
   ANNULER
========================================= */

function annulerModification() {
    reinitialiserFormulaire();
}



/* =========================================
   REINITIALISER
========================================= */

function reinitialiserFormulaire() {

    produitEnModification = null;
    imageUrlActuelle = null;

    document.getElementById("nom").value = "";
    document.getElementById("prix").value = "";
    document.getElementById("description").value = "";
    document.getElementById("categorie").value = categorieActive;
    document.getElementById("lien_achat").value = "";
    document.getElementById("actif").checked = true;
    document.getElementById("image_fichier").value = "";
    document.getElementById("apercuImage").innerHTML = "";

    document.getElementById("titreFormulaire").textContent =
        "➕ Ajouter un produit (" + nomsCategories[categorieActive] + ")";
    document.getElementById("boutonEnregistrer").textContent = "Ajouter le produit";
    document.getElementById("boutonAnnuler").style.display = "none";

}



/* =========================================
   PROTECTION HTML
========================================= */

function echapperHTML(texte) {
    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}



/* =========================================
   DEMARRAGE
========================================= */

document.addEventListener("DOMContentLoaded", async function() {

    const ok = await verifierSession();

    if(ok){
        chargerProduits();
    }

});

</script>


</body>

</html>
