<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Produits - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

<!-- Supabase doit être chargé avant notre JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Ton fichier JS commun -->
<script src="js/script.js"></script>

</head>

<body>

<header>
    <div class="logo">
        <img src="images/logo-seno.png" alt="Logo SenoMarket">
    </div>
</header>


<section class="affiliate">

<h2>🛒 Gestion des produits</h2>

<p>Ajoutez et gérez les produits de SenoMarket.</p>


<!-- FORMULAIRE -->

<div class="card">

<h3 id="titreFormulaire">➕ Ajouter un produit</h3>

<input
    type="text"
    id="nom"
    placeholder="Nom du produit"
    style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>

<input
    type="number"
    id="prix"
    placeholder="Prix"
    step="0.01"
    min="0"
    style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>

<textarea
    id="description"
    placeholder="Description du produit"
    rows="4"
    style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
></textarea>

<input
    type="text"
    id="categorie"
    placeholder="Catégorie"
    style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>

<input
    type="url"
    id="image_url"
    placeholder="URL de l'image du produit"
    style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>

<input
    type="url"
    id="lien_achat"
    placeholder="Lien d'achat"
    style="padding:12px;width:90%;margin:6px 0;border-radius:10px;"
>

<br>

<label>
    <input type="checkbox" id="actif" checked>
    Produit actif
</label>

<br><br>

<button
    type="button"
    onclick="enregistrerProduit()"
    class="gold-btn"
    id="boutonEnregistrer"
>
    Ajouter le produit
</button>

<button
    type="button"
    onclick="annulerModification()"
    class="gold-btn"
    id="boutonAnnuler"
    style="display:none;"
>
    Annuler
</button>

<p id="message"></p>

</div>


<br><br>


<!-- LISTE DES PRODUITS -->

<div class="card">

<h3>📦 Produits enregistrés</h3>

<div id="listeProduits">
    <p>Chargement des produits...</p>
</div>

</div>


<br>

<a href="dashboard.html" class="gold-btn">
    ⬅ Retour au tableau de bord
</a>

</section>


<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>


<script>

/* Protection administrateur */
if (localStorage.getItem("adminConnecte") !== "oui") {
    window.location.href = "administrateur.html";
}


/* Variable de modification */
let produitEnModification = null;


/* Charger les produits */
async function chargerProduits() {

    const zone = document.getElementById("listeProduits");

    zone.innerHTML = "<p>Connexion à Supabase...</p>";

    /* Diagnostic visible */
    if (typeof supabaseClient === "undefined" || !supabaseClient) {

        zone.innerHTML = `
            <p style="color:red;">
                ❌ supabaseClient n'est pas disponible.
            </p>
            <p>
                Vérifie que ton fichier JS est bien chargé.
            </p>
        `;

        return;
    }

    zone.innerHTML = "<p>Lecture de la table produits...</p>";

    const { data, error } = await supabaseClient
        .from("produits")
        .select("*")
        .order("created_at", { ascending: false });


    /* Afficher l'erreur exacte */
    if (error) {

        console.error(error);

        zone.innerHTML = `
            <p style="color:red;">
                ❌ Erreur Supabase
            </p>

            <p style="color:red;">
                ${echapperHTML(error.message)}
            </p>
        `;

        return;
    }


    /* Aucun produit */
    if (!data || data.length === 0) {

        zone.innerHTML = `
            <p>
                Aucun produit enregistré.
            </p>
        `;

        return;
    }


    zone.innerHTML = "";


    /* Afficher les produits */
    data.forEach(produit => {

        const statut = produit.actif
            ? "🟢 Actif"
            : "🔴 Inactif";

        const image = produit.image_url
            ? `
                <img
                    src="${echapperHTML(produit.image_url)}"
                    alt="${echapperHTML(produit.nom || "")}"
                    style="max-width:200px;border-radius:10px;"
                >
              `
            : "";

        const lien = produit.lien_achat
            ? `
                <p>
                    <a
                        href="${echapperHTML(produit.lien_achat)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="gold-btn"
                    >
                        🔗 Voir le lien d'achat
                    </a>
                </p>
              `
            : "";


        zone.innerHTML += `

            <div class="card" style="margin-bottom:20px;">

                ${image}

                <h3>
                    🛒 ${echapperHTML(produit.nom || "")}
                </h3>

                <p>
                    <strong>Prix :</strong>
                    ${produit.prix ?? ""}
                </p>

                <p>
                    <strong>Catégorie :</strong>
                    ${echapperHTML(produit.categorie || "Non définie")}
                </p>

                <p>
                    <strong>Description :</strong>
                    ${echapperHTML(produit.description || "Aucune description")}
                </p>

                <p>
                    <strong>Statut :</strong>
                    ${statut}
                </p>

                ${lien}

                <button
                    class="gold-btn"
                    onclick="modifierProduit('${produit.id}')"
                >
                    ✏️ Modifier
                </button>

                <button
                    class="gold-btn"
                    onclick="changerStatut('${produit.id}', ${!produit.actif})"
                >
                    ${produit.actif ? "🔴 Désactiver" : "🟢 Activer"}
                </button>

                <button
                    class="gold-btn"
                    onclick="supprimerProduit('${produit.id}')"
                >
                    🗑️ Supprimer
                </button>

            </div>
        `;

    });
}


/* Ajouter ou modifier */
async function enregistrerProduit() {

    const nom = document.getElementById("nom").value.trim();
    const prix = document.getElementById("prix").value;
    const description = document.getElementById("description").value.trim();
    const categorie = document.getElementById("categorie").value.trim();
    const image_url = document.getElementById("image_url").value.trim();
    const lien_achat = document.getElementById("lien_achat").value.trim();
    const actif = document.getElementById("actif").checked;
    const message = document.getElementById("message");


    if (!nom) {
        message.style.color = "red";
        message.textContent = "Veuillez entrer le nom du produit.";
        return;
    }

    if (prix === "") {
        message.style.color = "red";
        message.textContent = "Veuillez entrer le prix.";
        return;
    }


    const produit = {
        nom,
        prix: Number(prix),
        description: description || null,
        categorie: categorie || null,
        image_url: image_url || null,
        lien_achat: lien_achat || null,
        actif
    };


    let resultat;


    if (produitEnModification) {

        resultat = await supabaseClient
            .from("produits")
            .update(produit)
            .eq("id", produitEnModification);

    } else {

        resultat = await supabaseClient
            .from("produits")
            .insert(produit);

    }


    if (resultat.error) {

        message.style.color = "red";
        message.textContent =
            resultat.error.message;

        return;
    }


    message.style.color = "green";

    message.textContent =
        produitEnModification
        ? "✅ Produit modifié."
        : "✅ Produit ajouté.";


    reinitialiserFormulaire();

    await chargerProduits();
}


/* Modifier */
async function modifierProduit(id) {

    const { data, error } = await supabaseClient
        .from("produits")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {
        alert(error.message);
        return;
    }


    produitEnModification = data.id;

    document.getElementById("nom").value = data.nom || "";
    document.getElementById("prix").value = data.prix ?? "";
    document.getElementById("description").value = data.description || "";
    document.getElementById("categorie").value = data.categorie || "";
    document.getElementById("image_url").value = data.image_url || "";
    document.getElementById("lien_achat").value = data.lien_achat || "";
    document.getElementById("actif").checked = data.actif;


    document.getElementById("titreFormulaire").textContent =
        "✏️ Modifier le produit";

    document.getElementById("boutonEnregistrer").textContent =
        "Enregistrer les modifications";

    document.getElementById("boutonAnnuler").style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* Activer / désactiver */
async function changerStatut(id, nouveauStatut) {

    const { error } = await supabaseClient
        .from("produits")
        .update({ actif: nouveauStatut })
        .eq("id", id);


    if (error) {
        alert(error.message);
        return;
    }


    await chargerProduits();
}


/* Supprimer */
async function supprimerProduit(id) {

    if (!confirm("Voulez-vous vraiment supprimer ce produit ?")) {
        return;
    }


    const { error } = await supabaseClient
        .from("produits")
        .delete()
        .eq("id", id);


    if (error) {
        alert(error.message);
        return;
    }


    await chargerProduits();
}


/* Annuler */
function annulerModification() {
    reinitialiserFormulaire();
}


/* Réinitialiser */
function reinitialiserFormulaire() {

    produitEnModification = null;

    document.getElementById("nom").value = "";
    document.getElementById("prix").value = "";
    document.getElementById("description").value = "";
    document.getElementById("categorie").value = "";
    document.getElementById("image_url").value = "";
    document.getElementById("lien_achat").value = "";
    document.getElementById("actif").checked = true;

    document.getElementById("titreFormulaire").textContent =
        "➕ Ajouter un produit";

    document.getElementById("boutonEnregistrer").textContent =
        "Ajouter le produit";

    document.getElementById("boutonAnnuler").style.display =
        "none";
}


/* Protection du HTML */
function echapperHTML(texte) {

    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* Chargement initial */
document.addEventListener("DOMContentLoaded", () => {
    chargerProduits();
});

</script>

</body>
</html>
