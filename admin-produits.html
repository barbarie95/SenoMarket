<!-- =========================================
     PIED DE PAGE
========================================= -->

<footer>

    <p>

        © 2026 SenoMarket -
        Transformez vos idées en réussite

    </p>

</footer>




<script>


/* =========================================
   PROTECTION DE L'ESPACE ADMINISTRATEUR
========================================= */

const admin =
    localStorage.getItem("adminConnecte");


if(admin !== "oui"){

    window.location.href =
        "administrateur.html";

}



/* =========================================
   VARIABLE DE MODIFICATION
========================================= */

let produitEnModification = null;




/* =========================================
   CHARGER LES PRODUITS DEPUIS SUPABASE
========================================= */

async function chargerProduits(){


    const zone =
        document.getElementById(
            "listeProduits"
        );


    zone.innerHTML =
        "<p>Chargement des produits...</p>";



    /* =====================================
       REQUÊTE SUPABASE
       
       On lit la table :
       produits
    ====================================== */

    const {
        data,
        error
    } = await supabaseClient

        .from("produits")

        .select("*")

        .order(
            "created_at",
            {
                ascending: false
            }
        );



    /* =====================================
       ERREUR SUPABASE
       
       IMPORTANT :
       On affiche maintenant le vrai
       message d'erreur.
       
       C'est temporairement pour le
       diagnostic.
    ====================================== */

    if(error){

        console.error(
            "Erreur Supabase :",
            error
        );


        zone.innerHTML = `

            <p style="color:red;">

                ❌ Erreur Supabase

            </p>


            <p style="color:red;">

                ${error.message}

            </p>

        `;


        return;

    }



    /* =====================================
       AUCUN PRODUIT
    ====================================== */

    if(!data || data.length === 0){

        zone.innerHTML = `

            <p>

                Aucun produit enregistré.

            </p>

        `;


        return;

    }



    /* =====================================
       VIDER LA ZONE
    ====================================== */

    zone.innerHTML = "";



    /* =====================================
       AFFICHER CHAQUE PRODUIT
    ====================================== */

    data.forEach(function(produit){



        /* STATUT */

        const statut =
            produit.actif
            ? "🟢 Actif"
            : "🔴 Inactif";



        /* IMAGE */

        const image =
            produit.image_url
            ?

            `

            <img
                src="${echapperHTML(
                    produit.image_url
                )}"
                alt="${echapperHTML(
                    produit.nom
                )}"
                style="
                    max-width:200px;
                    border-radius:10px;
                    margin-bottom:10px;
                "
            >

            `

            :

            "";



        /* LIEN D'ACHAT */

        const lien =
            produit.lien_achat
            ?

            `

            <p>

                <a
                    href="${echapperHTML(
                        produit.lien_achat
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="gold-btn"
                >

                    🔗 Voir le lien d'achat

                </a>

            </p>

            `

            :

            "";



        /* CARTE PRODUIT */

        zone.innerHTML += `

            <div
                class="card"
                style="margin-bottom:20px;"
            >


                ${image}



                <h3>

                    🛒
                    ${echapperHTML(
                        produit.nom || ""
                    )}

                </h3>



                <p>

                    <strong>
                        Prix :
                    </strong>

                    ${produit.prix ?? ""}

                </p>



                <p>

                    <strong>
                        Catégorie :
                    </strong>

                    ${echapperHTML(
                        produit.categorie ||
                        "Non définie"
                    )}

                </p>



                <p>

                    <strong>
                        Description :
                    </strong>

                    ${echapperHTML(
                        produit.description ||
                        "Aucune description"
                    )}

                </p>



                <p>

                    <strong>
                        Statut :
                    </strong>

                    ${statut}

                </p>



                ${lien}



                <button
                    type="button"
                    class="gold-btn"
                    onclick="modifierProduit(
                        '${produit.id}'
                    )"
                >

                    ✏️ Modifier

                </button>



                <button
                    type="button"
                    class="gold-btn"
                    onclick="changerStatut(
                        '${produit.id}',
                        ${!produit.actif}
                    )"
                >

                    ${
                        produit.actif
                        ? "🔴 Désactiver"
                        : "🟢 Activer"
                    }

                </button>



                <button
                    type="button"
                    class="gold-btn"
                    onclick="supprimerProduit(
                        '${produit.id}'
                    )"
                >

                    🗑️ Supprimer

                </button>


            </div>

        `;

    });

}




/* =========================================
   AJOUTER OU MODIFIER UN PRODUIT
========================================= */

async function enregistrerProduit(){


    const nom =
        document
            .getElementById("nom")
            .value
            .trim();



    const prix =
        document
            .getElementById("prix")
            .value;



    const description =
        document
            .getElementById("description")
            .value
            .trim();



    const categorie =
        document
            .getElementById("categorie")
            .value
            .trim();



    const image_url =
        document
            .getElementById("image_url")
            .value
            .trim();



    const lien_achat =
        document
            .getElementById("lien_achat")
            .value
            .trim();



    const actif =
        document
            .getElementById("actif")
            .checked;



    const message =
        document.getElementById(
            "message"
        );



    /* =====================================
       VALIDATION DU NOM
    ====================================== */

    if(!nom){

        message.style.color =
            "red";


        message.textContent =
            "Veuillez entrer le nom du produit.";


        return;

    }



    /* =====================================
       VALIDATION DU PRIX
    ====================================== */

    if(prix === ""){

        message.style.color =
            "red";


        message.textContent =
            "Veuillez entrer le prix.";


        return;

    }



    /* =====================================
       DONNÉES DU PRODUIT
    ====================================== */

    const produit = {

        nom: nom,

        prix: Number(prix),

        description:
            description || null,

        categorie:
            categorie || null,

        image_url:
            image_url || null,

        lien_achat:
            lien_achat || null,

        actif:
            actif

    };



    /* =====================================
       MODIFICATION
    ====================================== */

    if(produitEnModification){


        const {
            error
        } = await supabaseClient

            .from("produits")

            .update(produit)

            .eq(
                "id",
                produitEnModification
            );



        if(error){

            console.error(
                "Erreur modification :",
                error
            );


            message.style.color =
                "red";


            message.textContent =
                "Erreur lors de la modification du produit.";


            return;

        }



        message.style.color =
            "green";


        message.textContent =
            "✅ Produit modifié avec succès.";

    }



    /* =====================================
       AJOUT
    ====================================== */

    else{


        const {
            error
        } = await supabaseClient

            .from("produits")

            .insert(produit);



        if(error){

            console.error(
                "Erreur ajout :",
                error
            );


            message.style.color =
                "red";


            message.textContent =
                "Erreur lors de l'ajout du produit.";


            return;

        }



        message.style.color =
            "green";


        message.textContent =
            "✅ Produit ajouté avec succès.";

    }



    /* =====================================
       APRÈS ENREGISTREMENT
    ====================================== */

    reinitialiserFormulaire();


    await chargerProduits();

}




/* =========================================
   MODIFIER UN PRODUIT
========================================= */

async function modifierProduit(id){


    const {
        data,
        error
    } = await supabaseClient

        .from("produits")

        .select("*")

        .eq(
            "id",
            id
        )

        .single();



    if(error){

        console.error(
            "Erreur récupération produit :",
            error
        );


        alert(
            "Impossible de récupérer le produit."
        );


        return;

    }



    /* ENREGISTRER L'ID */

    produitEnModification =
        data.id;



    /* REMPLIR LE FORMULAIRE */

    document
        .getElementById("nom")
        .value =
        data.nom || "";



    document
        .getElementById("prix")
        .value =
        data.prix ?? "";



    document
        .getElementById("description")
        .value =
        data.description || "";



    document
        .getElementById("categorie")
        .value =
        data.categorie || "";



    document
        .getElementById("image_url")
        .value =
        data.image_url || "";



    document
        .getElementById("lien_achat")
        .value =
        data.lien_achat || "";



    document
        .getElementById("actif")
        .checked =
        data.actif;



    /* MODIFIER LE TITRE */

    document
        .getElementById(
            "titreFormulaire"
        )
        .textContent =
        "✏️ Modifier le produit";



    /* MODIFIER LE BOUTON */

    document
        .getElementById(
            "boutonEnregistrer"
        )
        .textContent =
        "Enregistrer les modifications";



    /* AFFICHER ANNULER */

    document
        .getElementById(
            "boutonAnnuler"
        )
        .style.display =
        "inline-block";



    /* REMONTER EN HAUT */

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}




/* =========================================
   ACTIVER / DÉSACTIVER
========================================= */

async function changerStatut(
    id,
    nouveauStatut
){


    const {
        error
    } = await supabaseClient

        .from("produits")

        .update({

            actif:
                nouveauStatut

        })

        .eq(
            "id",
            id
        );



    if(error){

        console.error(
            "Erreur statut :",
            error
        );


        alert(
            "Impossible de modifier le statut."
        );


        return;

    }



    await chargerProduits();

}




/* =========================================
   SUPPRIMER UN PRODUIT
========================================= */

async function supprimerProduit(id){


    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer ce produit ?"
        );



    if(!confirmation){

        return;

    }



    const {
        error
    } = await supabaseClient

        .from("produits")

        .delete()

        .eq(
            "id",
            id
        );



    if(error){

        console.error(
            "Erreur suppression :",
            error
        );


        alert(
            "Impossible de supprimer le produit."
        );


        return;

    }



    await chargerProduits();

}




/* =========================================
   ANNULER UNE MODIFICATION
========================================= */

function annulerModification(){

    reinitialiserFormulaire();

}




/* =========================================
   RÉINITIALISER LE FORMULAIRE
========================================= */

function reinitialiserFormulaire(){


    produitEnModification =
        null;



    document
        .getElementById("nom")
        .value = "";



    document
        .getElementById("prix")
        .value = "";



    document
        .getElementById("description")
        .value = "";



    document
        .getElementById("categorie")
        .value = "";



    document
        .getElementById("image_url")
        .value = "";



    document
        .getElementById("lien_achat")
        .value = "";



    document
        .getElementById("actif")
        .checked = true;



    document
        .getElementById(
            "titreFormulaire"
        )
        .textContent =
        "➕ Ajouter un produit";



    document
        .getElementById(
            "boutonEnregistrer"
        )
        .textContent =
        "Ajouter le produit";



    document
        .getElementById(
            "boutonAnnuler"
        )
        .style.display =
        "none";



    document
        .getElementById(
            "message"
        )
        .textContent = "";

}

   PROTECTION CONTRE L'INSERTION HTML
========================================= */

    return String(texte)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
