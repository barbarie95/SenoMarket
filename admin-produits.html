<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Produits - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/script.js"></script>

</head>

<body>

<header>
<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>
</header>


<section class="affiliate">

<h2>🛒 Gestion des produits</h2>
<p>Ajoutez et gérez les produits de SenoMarket.</p>


<div class="card">

<h3 id="titreFormulaire">➕ Ajouter un produit</h3>

<input id="nom" type="text" placeholder="Nom du produit">
<input id="prix" type="number" placeholder="Prix" step="0.01" min="0">
<textarea id="description" placeholder="Description du produit" rows="4"></textarea>
<input id="categorie" type="text" placeholder="Catégorie">
<input id="image_url" type="url" placeholder="URL de l'image du produit">
<input id="lien_achat" type="url" placeholder="Lien d'achat">

<label>
<input id="actif" type="checkbox" checked>
Produit actif
</label>

<br><br>

<button
id="boutonEnregistrer"
class="gold-btn"
onclick="enregistrerProduit()">
Ajouter le produit
</button>

<button
id="boutonAnnuler"
class="gold-btn"
onclick="annulerModification()"
style="display:none;">
Annuler
</button>

<p id="message"></p>

</div>


<br>


<div class="card">

<h3>📦 Produits enregistrés</h3>

<div id="listeProduits">
<p>Chargement des produits...</p>
</div>

</div>


<br>

<a href="dashboard.html" class="gold-btn">
⬅ Retour au tableau de bord
</a>

</section>


<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>


<script>

if (localStorage.getItem("adminConnecte") !== "oui") {
window.location.href = "administrateur.html";
}

let produitEnModification = null;


async function chargerProduits() {

const zone = document.getElementById("listeProduits");

if (!supabaseClient) {
zone.innerHTML = "<p style='color:red'>❌ Supabase indisponible.</p>";
return;
}

const { data, error } = await supabaseClient
.from("produits")
.select("*")
.order("created_at", { ascending:false });

if (error) {
zone.innerHTML =
"<p style='color:red'>❌ " +
echapperHTML(error.message) +
"</p>";
return;
}

if (!data || data.length === 0) {
zone.innerHTML = "<p>Aucun produit enregistré.</p>";
return;
}

zone.innerHTML = "";

data.forEach(produit => {

zone.innerHTML += `

<div class="card" style="margin-bottom:20px;">

${produit.image_url ?
`<img src="${echapperHTML(produit.image_url)}"
style="max-width:200px;border-radius:10px;">`
: ""}

<h3>
🛒 ${echapperHTML(produit.nom || "")}
</h3>

<p>
<strong>Prix :</strong>
${produit.prix ?? ""}
</p>

<p>
<strong>Catégorie :</strong>
${echapperHTML(produit.categorie || "Non définie")}
</p>

<p>
<strong>Description :</strong>
${echapperHTML(produit.description || "Aucune description")}
</p>

<p>
<strong>Statut :</strong>
${produit.actif ? "🟢 Actif" : "🔴 Inactif"}
</p>

${produit.lien_achat ?
`<p>
<a href="${echapperHTML(produit.lien_achat)}"
target="_blank"
class="gold-btn">
🔗 Voir le lien d'achat
</a>
</p>`
: ""}

<button
class="gold-btn"
onclick="modifierProduit('${produit.id}')">
✏️ Modifier
</button>

<button
class="gold-btn"
onclick="changerStatut('${produit.id}',${!produit.actif})">
${produit.actif ? "🔴 Désactiver" : "🟢 Activer"}
</button>

<button
class="gold-btn"
onclick="supprimerProduit('${produit.id}')">
🗑️ Supprimer
</button>

</div>

`;

});

}


async function enregistrerProduit() {

const nom = document.getElementById("nom").value.trim();
const prix = document.getElementById("prix").value;
const description = document.getElementById("description").value.trim();
const categorie = document.getElementById("categorie").value.trim();
const image_url = document.getElementById("image_url").value.trim();
const lien_achat = document.getElementById("lien_achat").value.trim();
const actif = document.getElementById("actif").checked;
const message = document.getElementById("message");

if (!nom || prix === "") {
message.style.color = "red";
message.textContent = "Veuillez entrer le nom et le prix.";
return;
}

const produit = {
nom,
prix:Number(prix),
description:description || null,
categorie:categorie || null,
image_url:image_url || null,
lien_achat:lien_achat || null,
actif
};

let resultat;

if (produitEnModification) {

resultat = await supabaseClient
.from("produits")
.update(produit)
.eq("id", produitEnModification);

} else {

resultat = await supabaseClient
.from("produits")
.insert(produit);

}

if (resultat.error) {
message.style.color = "red";
message.textContent = resultat.error.message;
return;
}

message.style.color = "green";
message.textContent =
produitEnModification
? "✅ Produit modifié."
: "✅ Produit ajouté.";

reinitialiserFormulaire();
chargerProduits();

}


async function modifierProduit(id) {

const { data, error } = await supabaseClient
.from("produits")
.select("*")
.eq("id", id)
.single();

if (error) {
alert(error.message);
return;
}

produitEnModification = data.id;

document.getElementById("nom").value = data.nom || "";
document.getElementById("prix").value = data.prix ?? "";
document.getElementById("description").value = data.description || "";
document.getElementById("categorie").value = data.categorie || "";
document.getElementById("image_url").value = data.image_url || "";
document.getElementById("lien_achat").value = data.lien_achat || "";
document.getElementById("actif").checked = data.actif;

document.getElementById("titreFormulaire").textContent =
"✏️ Modifier le produit";

document.getElementById("boutonEnregistrer").textContent =
"Enregistrer les modifications";

document.getElementById("boutonAnnuler").style.display =
"inline-block";

window.scrollTo({top:0,behavior:"smooth"});

}


async function changerStatut(id, nouveauStatut) {

const resultat = await supabaseClient
.from("produits")
.update({ actif:nouveauStatut })
.eq("id",id)
.select("id,nom,actif");

console.log("UPDATE :", resultat);

if (resultat.error) {
alert("❌ Erreur UPDATE :\n\n" + resultat.error.message);
return;
}

if (!resultat.data || resultat.data.length === 0) {
alert("⚠️ Aucun produit modifié.\n\nID : " + id);
return;
}

alert(
"✅ Statut modifié : " +
(resultat.data[0].actif ? "ACTIF" : "INACTIF")
);

chargerProduits();

}


async function supprimerProduit(id) {

if (!confirm("Voulez-vous vraiment supprimer ce produit ?")) {
return;
}

const { error } = await supabaseClient
.from("produits")
.delete()
.eq("id",id);

if (error) {
alert(
"❌ Impossible de supprimer ce produit.\n\n" +
error.message
);
return;
}

chargerProduits();

}


function annulerModification() {
reinitialiserFormulaire();
}


function reinitialiserFormulaire() {

produitEnModification = null;

document.getElementById("nom").value = "";
document.getElementById("prix").value = "";
document.getElementById("description").value = "";
document.getElementById("categorie").value = "";
document.getElementById("image_url").value = "";
document.getElementById("lien_achat").value = "";
document.getElementById("actif").checked = true;

document.getElementById("titreFormulaire").textContent =
"➕ Ajouter un produit";

document.getElementById("boutonEnregistrer").textContent =
"Ajouter le produit";

document.getElementById("boutonAnnuler").style.display =
"none";

}


function echapperHTML(texte) {

return String(texte)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


document.addEventListener(
"DOMContentLoaded",
chargerProduits
);

</script>

</body>
</html>
