<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Affiliés - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>




<section class="affiliate">


<h2>🤝 Gestion des affiliés</h2>


<p>
Liste automatique des partenaires affiliés SenoMarket.
</p>




<div class="card">


<h3>📋 Liste des affiliés</h3>


<div id="listeAffilies">

<p>Chargement des affiliés...</p>

</div>


</div>





<br>


<a href="dashboard.html" class="gold-btn">

⬅ Retour au tableau de bord

</a>



</section>






<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>







<script>


const WEBHOOK_AFFILIES = 
"https://senomarket.app.n8n.cloud/webhook/admin-affilies";





async function chargerAffilies(){


const zone = document.getElementById("listeAffilies");



try{


const reponse = await fetch(WEBHOOK_AFFILIES);


const affilies = await reponse.json();



if(!affilies || affilies.length===0){


zone.innerHTML =
"<p>Aucun affilié trouvé.</p>";


return;

}




zone.innerHTML = "";



affilies.forEach(function(affilie){



zone.innerHTML += `


<div class="card">


<h3>👤 ${affilie.Nom || affilie.nom}</h3>



<p>
📧 Email :
${affilie.Email || affilie.email || "Non renseigné"}
</p>



<p>
📱 WhatsApp :
${affilie.WhatsApp || affilie.whatsapp || "Non renseigné"}
</p>



<p>
🔑 Code affilié :
${affilie["Code Affilié"] || affilie.code || ""}
</p>



<p>
🔗 Lien :
${affilie["Lien Affilié"] || affilie.lien || ""}
</p>



<p>
📈 Nombre de ventes :
${affilie["Nombre de ventes"] || affilie.ventes || 0}
</p>



<p>
💰 Commission totale :
${affilie["Commission totale"] || affilie.commissionTotale || 0} FCFA
</p>



</div>



`;



});




}


catch(error){


zone.innerHTML =
"<p style='color:red;'>Erreur de chargement des affiliés.</p>";


console.log(error);


}



}





chargerAffilies();



</script>




</body>

</html>
