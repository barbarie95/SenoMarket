<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Affiliés - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>



<section class="affiliate">


<h2>🤝 Gestion des affiliés</h2>


<p>
Consultez et gérez vos partenaires affiliés SenoMarket.
</p>



<div class="card">

<h3>🔎 Rechercher un affilié</h3>


<input 
type="text"
id="recherche"
placeholder="Nom ou code affilié..."
onkeyup="filtrerAffilies()"
style="padding:12px;width:80%;border-radius:10px;">


</div>




<div class="card">


<h3>📋 Liste des affiliés</h3>


<div id="listeAffilies">

<p>Chargement des affiliés...</p>

</div>


</div>



<br>


<a href="dashboard.html" class="gold-btn">

⬅ Retour au tableau de bord

</a>


</section>




<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>





<script>


const WEBHOOK_AFFILIES =
"https://senomarket.app.n8n.cloud/webhook/admin-affilies";


let tousLesAffilies = [];




async function chargerAffilies(){


const zone = document.getElementById("listeAffilies");


try{


const reponse = await fetch(WEBHOOK_AFFILIES);


tousLesAffilies = await reponse.json();



afficherAffilies(tousLesAffilies);



}


catch(error){


zone.innerHTML =
"<p style='color:red;'>Erreur de chargement.</p>";


console.log(error);


}


}





function afficherAffilies(liste){


const zone =
document.getElementById("listeAffilies");



if(!liste || liste.length === 0){


zone.innerHTML =
"<p>Aucun affilié trouvé.</p>";

return;


}



zone.innerHTML = "";



liste.forEach(function(affilie){



let nom =
affilie.Nom || affilie.nom || "Sans nom";


let code =
affilie["Code Affilié"] || affilie.code || "";


let lien =
affilie["Lien Affilié"] || affilie.lien || "";


let ventes =
affilie["Nombre de ventes"] || affilie.ventes || 0;


let commission =
affilie["Commission totale"] || affilie.commissionTotale || 0;



zone.innerHTML += `


<div class="card">


<h3>👤 ${nom}</h3>


<p>🔑 Code :
${code}
</p>


<p>
🔗 Lien affilié :
<br>
${lien}
</p>


<button 
class="gold-btn"
onclick="copierLien('${lien}')">

📋 Copier le lien

</button>


<p>
📈 Nombre de ventes :
<b>${ventes}</b>
</p>


<p>
💰 Commission totale :
<b>${commission} FCFA</b>
</p>



</div>


`;



});


}





function filtrerAffilies(){


let recherche =
document.getElementById("recherche").value.toLowerCase();



let resultat =
tousLesAffilies.filter(function(affilie){


let nom =
(affilie.Nom || affilie.nom || "").toLowerCase();



let code =
(affilie["Code Affilié"] || affilie.code || "").toLowerCase();



return nom.includes(recherche)
||
code.includes(recherche);



});



afficherAffilies(resultat);



}




function copierLien(lien){


navigator.clipboard.writeText(lien);


alert("Lien affilié copié !");


}





chargerAffilies();



</script>



</body>

</html>
