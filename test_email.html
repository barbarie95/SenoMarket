<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test Email SenoMarket</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      border-radius: 8px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>Test Email SenoMarket</h1>

  <p>
    Cette page teste l'envoi d'un email avec
    Supabase et Resend.
  </p>

  <button id="testButton">
    Envoyer l'email de test
  </button>

  <div id="result"></div>

  <script>
    const testButton = document.getElementById("testButton");
    const result = document.getElementById("result");

    const FUNCTION_URL =
      "https://vfnqwdwgkocpkkaofrum.supabase.co/functions/v1/test-email";

    /*
      IMPORTANT :
      Remplace uniquement la valeur ci-dessous par ta
      SUPABASE_PUBLISHABLE_KEY.

      NE METS PAS RESEND_API_KEY ICI.
    */
    const SUPABASE_PUBLISHABLE_KEY = "COLLE_TA_CLE_PUBLISHABLE_ICI";

    testButton.addEventListener("click", async () => {

      testButton.disabled = true;
      testButton.textContent = "Envoi en cours...";

      result.style.display = "block";
      result.textContent = "Connexion à Supabase...";

      try {

        const response = await fetch(FUNCTION_URL, {
          method: "POST",

          headers: {
            "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY,
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Content-Type": "application/json"
          },

          body: JSON.stringify({})
        });

        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          data = {
            response: responseText
          };
        }

        if (response.ok && data.success === true) {

          result.textContent =
            "✅ SUCCÈS !\n\n" +
            "Supabase a accepté la demande.\n" +
            "Resend a accepté l'envoi.\n\n" +
            "Vérifie maintenant :\n" +
            "gansonrea534@gmail.com\n\n" +
            "Regarde également dans les spams.";

        } else {

          result.textContent =
            "❌ ÉCHEC\n\n" +
            "Code HTTP : " +
            response.status +
            "\n\n" +
            "Réponse :\n" +
            JSON.stringify(data, null, 2);
        }

      } catch (error) {

        result.textContent =
          "❌ ERREUR DE CONNEXION\n\n" +
          error.message;
      }

      testButton.disabled = false;
      testButton.textContent = "Renvoyer l'email de test";
    });
  </script>

</body>
</html>
