<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test Email SenoMarket</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      border-radius: 8px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h1>Test Email SenoMarket</h1>

  <p>
    Cette page permet de vérifier la connexion entre
    SenoMarket, Supabase et Resend.
  </p>

  <button id="testButton">
    Envoyer l'email de test
  </button>

  <div id="result"></div>

  <script>
    const testButton = document.getElementById("testButton");
    const result = document.getElementById("result");

    const FUNCTION_URL =
      "https://vfnqwdwgkocpkkaofrum.supabase.co/functions/v1/test-email";

    testButton.addEventListener("click", async () => {

      testButton.disabled = true;
      testButton.textContent = "Envoi en cours...";

      result.style.display = "block";
      result.textContent = "Connexion à la fonction test-email...";

      try {

        const response = await fetch(FUNCTION_URL, {
          method: "POST"
        });

        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          data = {
            response: responseText
          };
        }

        if (response.ok && data.success === true) {

          result.textContent =
            "✅ SUCCÈS !\n\n" +
            "La fonction test-email a répondu correctement.\n\n" +
            "Resend a accepté l'envoi de l'email.\n\n" +
            "Vérifie maintenant la boîte :\n" +
            "gansonrea534@gmail.com\n\n" +
            "Pense également à vérifier le dossier Spam.";

        } else {

          result.textContent =
            "❌ ÉCHEC DE L'ENVOI\n\n" +
            "Code HTTP : " +
            response.status +
            "\n\n" +
            "Réponse de Supabase :\n\n" +
            JSON.stringify(data, null, 2);

        }

      } catch (error) {

        result.textContent =
          "❌ ERREUR DE CONNEXION\n\n" +
          "Le navigateur n'a pas réussi à récupérer la réponse de Supabase.\n\n" +
          "Message :\n" +
          error.message;

      }

      testButton.disabled = false;
      testButton.textContent = "Renvoyer l'email de test";
    });
  </script>

</body>
</html>
