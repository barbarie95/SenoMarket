<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>



<section class="affiliate">

<h2>🔐 Espace Administrateur SenoMarket</h2>

<p>
Connectez-vous pour gérer votre boutique.
</p>



<div class="card" style="max-width:500px;margin:auto;">


<h3>
Accès administrateur
</h3>


<input
type="email"
id="admin-email"
placeholder="Email administrateur"
style="padding:12px;width:80%;border-radius:10px;margin-bottom:10px;">


<br>


<input 
type="password"
id="admin-password"
placeholder="Entrez le mot de passe"
style="padding:12px;width:80%;border-radius:10px;">


<br><br>


<button onclick="connexionAdmin()" class="gold-btn">
Se connecter
</button>


<p id="admin-error" style="color:red;"></p>


</div>


</section>



<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://vfnqwdwgkocpkkaofrum.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_BOFyx3zpbcwtN6h-3N0wLw_L1QOJWR-";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   CONNEXION ADMIN
========================= */

async function connexionAdmin(){

    const email =
        document.getElementById("admin-email").value.trim();

    const password =
        document.getElementById("admin-password").value;

    const error =
        document.getElementById("admin-error");

    error.textContent = "";

    if(!email || !password){

        error.textContent =
            "Merci de remplir l'email et le mot de passe.";

        return;
    }

    const { data, error: authError } =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(authError){

        error.textContent =
            "Email ou mot de passe incorrect.";

        return;
    }

    localStorage.setItem("adminConnecte","oui");

    window.location.href="dashboard.html";

}


</script>



</body>

</html>
