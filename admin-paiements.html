<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Paiements - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>




<section class="affiliate">


<h2>💰 Gestion des paiements</h2>


<p>
Suivez les demandes de retrait des affiliés.
</p>





<div class="card">


<h3>➕ Ajouter une demande</h3>



<input
type="text"
id="nomPaiement"
placeholder="Nom de l'affilié"
style="padding:12px;width:80%;border-radius:10px;">


<br><br>


<input
type="number"
id="montantPaiement"
placeholder="Montant (FCFA)"
style="padding:12px;width:80%;border-radius:10px;">


<br><br>


<button onclick="ajouterPaiement()" class="gold-btn">

Ajouter

</button>



</div>







<div class="card">


<h3>📋 Demandes de paiement</h3>


<div id="listePaiements">

<p>Aucune demande enregistrée.</p>

</div>



</div>





<br>


<a href="dashboard.html" class="gold-btn">

⬅ Retour au tableau de bord

</a>



</section>





<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>






<script>


let paiements = JSON.parse(localStorage.getItem("paiementsSeno")) || [];




function afficherPaiements(){


let zone = document.getElementById("listePaiements");



if(paiements.length===0){

zone.innerHTML="<p>Aucune demande enregistrée.</p>";

return;

}



zone.innerHTML="";



paiements.forEach(function(p,index){


zone.innerHTML += `

<div class="card">


<h3>${p.nom}</h3>


<p>
Montant demandé : ${p.montant} FCFA
</p>


<p>
Statut : En attente
</p>



<button onclick="supprimerPaiement(${index})" class="gold-btn">

🗑 Supprimer

</button>



</div>

`;



});


}




function ajouterPaiement(){


let nom=document.getElementById("nomPaiement").value;

let montant=document.getElementById("montantPaiement").value;



if(nom==="" || montant===""){

alert("Remplissez tous les champs.");

return;

}



paiements.push({

nom:nom,

montant:montant

});



localStorage.setItem("paiementsSeno",JSON.stringify(paiements));



document.getElementById("nomPaiement").value="";

document.getElementById("montantPaiement").value="";



afficherPaiements();



}





function supprimerPaiement(index){


paiements.splice(index,1);


localStorage.setItem("paiementsSeno",JSON.stringify(paiements));


afficherPaiements();


}





afficherPaiements();



</script>




</body>

</html>
