<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Paiements - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>

</header>



<section class="affiliate">


<h2>💰 Gestion des paiements</h2>

<p>
Consultez les demandes de paiement des affiliés.
</p>



<div class="card">

<h3>Liste des paiements</h3>

<div id="listePaiements">

<p>Chargement des paiements...</p>

</div>

</div>



<br>


<a href="dashboard.html" class="gold-btn">
⬅ Retour au tableau de bord
</a>


</section>



<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>



<script>


const webhook = "https://senomarket.app.n8n.cloud/webhook/senomarket-admin?action=paiements";


fetch(webhook)

.then(response => response.json())

.then(data => {


let zone = document.getElementById("listePaiements");

zone.innerHTML = "";



if(data.length === 0){

zone.innerHTML = "<p>Aucune demande de paiement.</p>";

return;

}



data.forEach(function(paiement){


zone.innerHTML += `

<div class="card">

<h3>💰 ${paiement["Nom"]}</h3>

<p>
Code affilié : ${paiement["Code Affilié"]}
</p>

<p>
Email : ${paiement["Email"]}
</p>

<p>
Moyen de paiement : ${paiement["Moyen de paiement"]}
</p>

<p>
Informations : ${paiement["Informations de paiement"]}
</p>

<p>
Montant demandé : ${paiement["Montant demandé"]}
</p>

<p>
Date : ${paiement["Date"]}
</p>

<p>
Statut : ${paiement["Statut"]}
</p>

</div>

`;


});


})


.catch(error => {


document.getElementById("listePaiements").innerHTML =
"Erreur de chargement des paiements.";


});


</script>



</body>

</html>
