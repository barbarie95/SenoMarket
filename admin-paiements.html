<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Paiements - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>
</header>

<section class="affiliate">

<h2>💰 Gestion des paiements</h2>

<p>
Consultez et gérez les demandes de retrait des affiliés.
</p>

<div class="card">

<h3>📋 Demandes de retrait</h3>

<div id="listePaiements">
Chargement...
</div>

</div>

<br>

<a href="dashboard.html" class="gold-btn">
⬅ Retour au tableau de bord
</a>

</section>

<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>


<script>

const SUPABASE_URL =
"https://vfnqwdwgkocpkkaofrum.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_BOFyx3zpbcwtN6h-3N0wLw_L1QOJWR-";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


async function chargerPaiements() {

    const zone =
        document.getElementById("listePaiements");


    const { data, error } =
        await supabaseClient
        .from("retraits")
        .select("*")
        .order(
            "date_demande",
            { ascending:false }
        );


    console.log("DONNEES RETRAITS :", data);
    console.log("ERREUR :", error);


    if (error) {

        zone.innerHTML =
            "<p style='color:red'>" +
            error.message +
            "</p>";

        return;
    }


    if (!data || data.length === 0) {

        zone.innerHTML =
            "<p>Aucune demande de retrait.</p>";

        return;
    }


    zone.innerHTML = "";


    data.forEach(function(retrait) {


        const carte =
            document.createElement("div");


        carte.className = "card";


        carte.style.cssText = `
            margin-bottom:20px;
            text-align:left;
            color:#111;
        `;


        carte.innerHTML = `

            <h3>
                👤 Demande de retrait
            </h3>

            <p>
                🆔 ID affilié :
                <b>${retrait.affilie_id}</b>
            </p>

            <p>
                💰 Montant demandé :
                <b>
                ${retrait.montant_demande}
                FCFA
                </b>
            </p>

            <p>
                ⏳ Statut :
                <b>${retrait.statut}</b>
            </p>

            <p>
                📅 Date de demande :
                ${retrait.date_demande || "Non renseignée"}
            </p>

            <p>
                💳 Moyen de paiement :
                ${retrait.moyen_paiement || "Non renseigné"}
            </p>

            <p>
                📱 Numéro de paiement :
                ${retrait.numero_paiement || "Non renseigné"}
            </p>

            <p>
                ✅ Date de paiement :
                ${retrait.date_paiement || "Pas encore payé"}
            </p>


            <div style="
                margin-top:20px;
                display:flex;
                gap:10px;
                flex-wrap:wrap;
            ">

                <button
                    type="button"
                    onclick="marquerPaye('${retrait.id}')"
                    style="
                        display:inline-block !important;
                        visibility:visible !important;
                        opacity:1 !important;
                        background:#d4af37;
                        color:#111;
                        border:2px solid #111;
                        padding:12px 18px;
                        border-radius:8px;
                        cursor:pointer;
                        font-weight:bold;
                        font-size:15px;
                    "
                >
                    ✅ MARQUER COMME PAYÉ
                </button>


                <button
                    type="button"
                    onclick="refuserRetrait('${retrait.id}')"
                    style="
                        display:inline-block !important;
                        visibility:visible !important;
                        opacity:1 !important;
                        background:#b00020;
                        color:white;
                        border:2px solid #111;
                        padding:12px 18px;
                        border-radius:8px;
                        cursor:pointer;
                        font-weight:bold;
                        font-size:15px;
                    "
                >
                    ❌ REFUSER
                </button>

            </div>

        `;


        zone.appendChild(carte);

    });

}


async function marquerPaye(id) {

    const confirmation =
        confirm(
            "Confirmer le paiement de ce retrait ?"
        );


    if (!confirmation) return;


    const { error } =
        await supabaseClient
        .from("retraits")
        .update({
            statut:"paid",
            date_paiement:
                new Date().toISOString()
        })
        .eq("id",id);


    if (error) {

        alert(
            "Erreur : " +
            error.message
        );

        return;
    }


    alert(
        "Retrait marqué comme payé."
    );


    chargerPaiements();

}


async function refuserRetrait(id) {

    const confirmation =
        confirm(
            "Refuser cette demande de retrait ?"
        );


    if (!confirmation) return;


    const { error } =
        await supabaseClient
        .from("retraits")
        .update({
            statut:"rejected"
        })
        .eq("id",id);


    if (error) {

        alert(
            "Erreur : " +
            error.message
        );

        return;
    }


    alert(
        "Demande refusée."
    );


    chargerPaiements();

}


document.addEventListener(
    "DOMContentLoaded",
    chargerPaiements
);

</script>

</body>
</html>
