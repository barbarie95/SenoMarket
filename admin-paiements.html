<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Paiements - SenoMarket</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

<header>
<div class="logo">
<img src="images/logo-seno.png" alt="Logo SenoMarket">
</div>
</header>


<section class="affiliate">

<h2>💰 Gestion des paiements</h2>

<p>
Consultez et gérez les demandes de retrait des affiliés.
</p>


<div class="card">

<h3>📋 Demandes de retrait</h3>

<div id="listePaiements">
<p>Chargement...</p>
</div>

</div>


<br>


<a href="dashboard.html" class="gold-btn">
⬅ Retour au tableau de bord
</a>

</section>


<footer>

<p>
© 2026 SenoMarket - Transformez vos idées en réussite
</p>

</footer>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://vfnqwdwgkocpkkaofrum.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_BOFyx3zpbcwtN6h-3N0wLw_L1QOJWR-";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ================================
   CHARGER LES RETRAITS
================================ */

async function chargerPaiements() {

    const zone =
        document.getElementById("listePaiements");

    zone.innerHTML =
        "<p>Chargement...</p>";


    const { data, error } =
        await supabaseClient
        .from("retraits")
        .select("*")
        .order(
            "date_demande",
            { ascending: false }
        );


    console.log("RETRAITS :", data);
    console.log("ERREUR :", error);


    if (error) {

        zone.innerHTML = `
            <p style="color:red;">
                Erreur Supabase :
                ${error.message}
            </p>
        `;

        return;
    }


    if (!data || data.length === 0) {

        zone.innerHTML = `
            <p>
                Aucune demande de retrait.
            </p>
        `;

        return;
    }


    zone.innerHTML = "";


    for (const retrait of data) {


        /* AFFILIÉ */

        let affilie = null;


        if (retrait.affilie_id) {

            const resultat =
                await supabaseClient
                .from("affilies")
                .select(
                    "nom,email,code_affilie"
                )
                .eq(
                    "id",
                    retrait.affilie_id
                )
                .maybeSingle();


            affilie =
                resultat.data;
        }


        const nom =
            affilie?.nom ||
            "Affilié inconnu";


        const email =
            affilie?.email ||
            "Non renseigné";


        const code =
            affilie?.code_affilie ||
            "Non renseigné";


        const montant =
            Number(
                retrait.montant_demande || 0
            ).toLocaleString("fr-FR");


        const statut =
            retrait.statut ||
            "pending";


        const dateDemande =
            retrait.date_demande
            ? new Date(
                retrait.date_demande
              ).toLocaleString("fr-FR")
            : "Non renseignée";


        const datePaiement =
            retrait.date_paiement
            ? new Date(
                retrait.date_paiement
              ).toLocaleString("fr-FR")
            : "Pas encore payé";


        zone.innerHTML += `

        <div class="card"
             style="
                margin-bottom:20px;
                text-align:left;
             ">

            <h3>
                👤 ${nom}
            </h3>

            <p>
                📧 Email :
                <b>${email}</b>
            </p>

            <p>
                🔑 Code affilié :
                <b>${code}</b>
            </p>

            <p>
                💰 Montant demandé :
                <b>${montant} FCFA</b>
            </p>

            <p>
                ⏳ Statut :
                <b>${statut}</b>
            </p>

            <p>
                📅 Date de demande :
                ${dateDemande}
            </p>

            <p>
                💳 Moyen de paiement :
                <b>
                ${
                    retrait.moyen_paiement ||
                    "Non renseigné"
                }
                </b>
            </p>

            <p>
                📱 Numéro de paiement :
                <b>
                ${
                    retrait.numero_paiement ||
                    "Non renseigné"
                }
                </b>
            </p>

            <p>
                ✅ Date de paiement :
                ${datePaiement}
            </p>


            ${
                statut === "pending"

                ?

                `
                <div style="
                    display:flex;
                    gap:10px;
                    flex-wrap:wrap;
                    margin-top:15px;
                ">

                    <button
                        class="gold-btn"
                        onclick="
                            marquerPaye(
                                '${retrait.id}'
                            )
                        "
                        style="cursor:pointer;"
                    >
                        ✅ Marquer comme payé
                    </button>


                    <button
                        class="gold-btn"
                        onclick="
                            refuserRetrait(
                                '${retrait.id}'
                            )
                        "
                        style="
                            background:#b00020;
                            color:white;
                            cursor:pointer;
                        "
                    >
                        ❌ Refuser
                    </button>

                </div>
                `

                :

                ""
            }

        </div>

        `;
    }
}


/* ================================
   MARQUER PAYÉ
================================ */

async function marquerPaye(id) {

    if (
        !confirm(
            "Confirmer le paiement de ce retrait ?"
        )
    ) return;


    const { error } =
        await supabaseClient
        .from("retraits")
        .update({

            statut: "paid",

            date_paiement:
                new Date().toISOString()

        })
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Erreur : " +
            error.message
        );

        return;
    }


    alert(
        "Retrait marqué comme payé."
    );


    chargerPaiements();
}


/* ================================
   REFUSER
================================ */

async function refuserRetrait(id) {

    if (
        !confirm(
            "Refuser cette demande de retrait ?"
        )
    ) return;


    const { error } =
        await supabaseClient
        .from("retraits")
        .update({

            statut: "rejected"

        })
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Erreur : " +
            error.message
        );

        return;
    }


    alert(
        "Demande refusée."
    );


    chargerPaiements();
}


/* ================================
   DÉMARRAGE
================================ */

document.addEventListener(
    "DOMContentLoaded",
    chargerPaiements
);

</script>

</body>
</html>
